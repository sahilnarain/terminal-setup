# Tokyo Night (Night), approximated to ANSI 16 colours.
# Palette: https://github.com/folke/tokyonight.nvim (night style)
#
#   ANSI 0  Black          #1a1b26   bg
#   ANSI 1  Red            #f7768e
#   ANSI 2  Green          #9ece6a
#   ANSI 3  Yellow         #e0af68
#   ANSI 4  Blue           #7aa2f7
#   ANSI 5  Magenta        #bb9af7
#   ANSI 6  Cyan           #7dcfff
#   ANSI 7  White          #c0caf5   fg + muted text
#   ANSI 8  Bright Black   #292e42   bg_highlight / surfaces / borders
#   ANSI 9  Bright Red     #ff9e64   (orange)
#   ANSI 10 Bright Green   #73daca   (teal)
#   ANSI 11 Bright Yellow  #e0af68
#   ANSI 12 Bright Blue    #7aa2f7
#   ANSI 13 Bright Magenta #bb9af7
#   ANSI 14 Bright Cyan    #7dcfff
#   ANSI 15 Bright White   #c0caf5
#
# The muted text tokens (the mid-grey #737aa2 in the original) are painted
# directly on the canvas, so with no mid-grey in ANSI 16 they take the readable
# white slot rather than the dark surface tone.

# Canvas. The field behind everything, wherever no panel covers it. Left unset
# it is the terminal's own; set here to bg, so the palette owns the whole screen
# rather than only the parts it paints. Setting it ends terminal transparency,
# and it requires `text` below.
background: "#1a1b26"

# Surfaces. Panels sit above bg on bg_highlight; the status bar uses bg_dark,
# one step below, so it reads as a floor rather than a panel.
surface_overlay: "#292e42"
surface_help: "#292e42"
surface_toast: "#292e42"
surface_status_bar: "#1a1b26"
surface_selected: "#7aa2f7"
surface_self_mention: "#bb9af7"
surface_code: "#1a1b26"

# Text. `text` is the body - message text, chat titles, folder labels, search
# rows - and is the largest area of colour on screen. Left unset it comes from
# the terminal; set here to fg.
text: "#c0caf5"
text_dim: "#c0caf5"
text_muted: "#c0caf5"
text_faint: "#c0caf5"
text_subtle: "#c0caf5"
text_on_surface: "#c0caf5"
text_status_bar: "#c0caf5"
text_on_selected: "#1a1b26"
text_on_selected_muted: "#1a1b26"
text_on_toast: "#c0caf5"
text_mode_label: "#1a1b26"
text_code: "#c0caf5"

# Accents. All three backgrounds here are dark, so all three are light.
accent: "#7aa2f7"
accent_on_surface: "#7aa2f7"
accent_status_bar: "#7aa2f7"
accent_insert: "#9ece6a"
accent_mode_normal: "#7aa2f7"
accent_mode_insert: "#9ece6a"

# Status and message state.
status_error: "#f7768e"
status_warning: "#ff9e64"
status_info: "#7dcfff"
status_online: "#9ece6a"
tick_sent: "#c0caf5"
tick_outbox: "#c0caf5"
tick_read: "#7dcfff"
tick_failed: "#f7768e"
name_incoming: "#9ece6a"
name_editing: "#e0af68"
indicator: "#73daca"
unread_separator: "#7dcfff"
waveform_played: "#7dcfff"
reaction_chosen: "#9ece6a"
unread_reaction: "#bb9af7"
unread_mention: "#7aa2f7"

# Borders.
border_pane_active: "#9ece6a"
border_bubble_in: "#292e42"
border_bubble_out: "#7aa2f7"
border_overlay: "#292e42"
border_composer_focused: "#9ece6a"
border_composer_flash: "#f7768e"
border_status_sep: "#292e42"

# Message markup.
markup_link: "#7dcfff"
markup_ref: "#bb9af7"
markup_self_mention_fg: "#1a1b26"

# Highlights. The two base tones are what a highlight fades back to, so each is
# what the thing normally looks like: chat-row text, and the incoming border.
highlight_accent: "#ff9e64"
highlight_error: "#f7768e"
highlight_base_chat: "#c0caf5"
highlight_base_bubble: "#292e42"
overlay_dim: "#292e42"

# Composer.
composer_counter_dim: "#c0caf5"
composer_glyph_idle: "#c0caf5"
composer_glyph_ready: "#7aa2f7"

# Per-sender names, walking the scheme's hues so adjacent senders differ in hue
# rather than only in shade.
sender_palette:
  - "#f7768e" # red
  - "#ff9e64" # orange
  - "#e0af68" # yellow
  - "#9ece6a" # green
  - "#73daca" # teal
  - "#7dcfff" # cyan
  - "#7aa2f7" # blue
  - "#bb9af7" # magenta

logo_gradient:
  - {pos: 0.00, color: "#292e42"}
  - {pos: 0.30, color: "#292e42"}
  - {pos: 0.60, color: "#7aa2f7"}
  - {pos: 0.85, color: "#7aa2f7"}
  - {pos: 1.00, color: "#c0caf5"}
