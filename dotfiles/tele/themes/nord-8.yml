# Tokyo Night (Night), for a dark 8-bit terminal.
# Palette: xterm-256 / ANSI 256-colour
#
# Approximate mappings:
#   bg       #1a1b26 -> 234
#   bg_dark  #16161e -> 233
#   bg_highlight #292e42 -> 236
#   fg       #c0caf5 -> 189
#   fg_dark  #a9b1d6 -> 146
#   fg_gutter #3b4261 -> 60
#   dark3    #545c7e -> 60
#   comment  #565f89 -> 61
#   dark5    #737aa2 -> 103
#
#   red     #f7768e -> 210
#   orange  #ff9e64 -> 215
#   yellow  #e0af68 -> 179
#   green   #9ece6a -> 149
#   teal    #73daca -> 116
#   cyan    #7dcfff -> 117
#   blue    #7aa2f7 -> 111
#   blue0   #3d59a1 -> 61
#   magenta #bb9af7 -> 141
#   purple  #9d7cd8 -> 98

# Canvas.
background: 234

# Surfaces.
surface_overlay: 236
surface_help: 236
surface_toast: 60
surface_status_bar: 233
surface_selected: 111
surface_self_mention: 141
surface_code: 233

# Text.
text: 189
text_dim: 146
text_muted: 103
text_faint: 103
text_subtle: 146
text_on_surface: 189
text_status_bar: 189
text_on_selected: 233
text_on_selected_muted: 234
text_on_toast: 189
text_mode_label: 233
text_code: 189

# Accents.
accent: 111
accent_on_surface: 111
accent_status_bar: 111
accent_insert: 149
accent_mode_normal: 111
accent_mode_insert: 149

# Status and message state.
status_error: 210
status_warning: 215
status_info: 117
status_online: 149
tick_sent: 103
tick_outbox: 103
tick_read: 117
tick_failed: 210
name_incoming: 149
name_editing: 179
indicator: 116
unread_separator: 117
waveform_played: 117
reaction_chosen: 149
unread_reaction: 141
unread_mention: 111

# Borders.
border_pane_active: 149
border_bubble_in: 60
border_bubble_out: 61
border_overlay: 60
border_composer_focused: 149
border_composer_flash: 210
border_status_sep: 60

# Message markup.
markup_link: 117
markup_ref: 141
markup_self_mention_fg: 233

# Highlights.
highlight_accent: 215
highlight_error: 210
highlight_base_chat: 189
highlight_base_bubble: 60
overlay_dim: 61

# Composer.
composer_counter_dim: 103
composer_glyph_idle: 103
composer_glyph_ready: 111

# Per-sender names.
sender_palette:
  - 210 # red
  - 215 # orange
  - 179 # yellow
  - 149 # green
  - 116 # teal
  - 117 # cyan
  - 111 # blue
  - 141 # magenta

logo_gradient:
  - {pos: 0.00, color: 236}
  - {pos: 0.30, color: 60}
  - {pos: 0.60, color: 61}
  - {pos: 0.85, color: 111}
  - {pos: 1.00, color: 189}
