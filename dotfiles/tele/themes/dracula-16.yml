# Dracula, approximated to ANSI 16 colours.
# Palette: https://draculatheme.com/contribute
#
#   ANSI 0  Black          #282a36   background
#   ANSI 1  Red            #ff5555
#   ANSI 2  Green          #50fa7b
#   ANSI 3  Yellow         #f1fa8c
#   ANSI 4  Blue           #bd93f9   (Dracula purple)
#   ANSI 5  Magenta        #ff79c6   (Dracula pink)
#   ANSI 6  Cyan           #8be9fd
#   ANSI 7  White          #f8f8f2   foreground + muted text
#   ANSI 8  Bright Black   #44475a   current line / surfaces / borders
#   ANSI 9  Bright Red     #ffb86c   (Dracula orange)
#   ANSI 10 Bright Green   #d6acff   (bright purple, no green slot left)
#   ANSI 11 Bright Yellow  #f1fa8c
#   ANSI 12 Bright Blue    #bd93f9
#   ANSI 13 Bright Magenta #ff79c6
#   ANSI 14 Bright Cyan    #8be9fd
#   ANSI 15 Bright White   #f8f8f2
#
# The muted text tokens (the mid-greys #9ba3c7/#8a93ba in the original) are
# painted directly on the canvas, so with no mid-grey in ANSI 16 they take the
# readable white slot rather than the dark surface tone.

# Canvas. The field behind everything, wherever no panel covers it. Left unset
# it is the terminal's own; set here to the scheme's background, so the palette
# owns the whole screen rather than only the parts it paints. Setting it ends
# terminal transparency, and it requires `text` below.
background: "#282a36"

# Surfaces. Panels use the current-line grey, which is the scheme's one lifted
# tone; the status bar goes a shade below the canvas so it reads as a floor.
surface_overlay: "#44475a"
surface_help: "#44475a"
surface_toast: "#44475a"
surface_status_bar: "#282a36"
surface_selected: "#bd93f9"
surface_self_mention: "#ff79c6"
surface_code: "#282a36"

# Text. `text` is the body - message text, chat titles, folder labels, search
# rows - and is the largest area of colour on screen. Left unset it comes from
# the terminal; set here to the scheme's foreground.
text: "#f8f8f2"
text_dim: "#f8f8f2"
text_muted: "#f8f8f2"
text_faint: "#f8f8f2"
text_subtle: "#f8f8f2"
text_on_surface: "#f8f8f2"
text_status_bar: "#f8f8f2"
text_on_selected: "#282a36"
text_on_selected_muted: "#282a36"
text_on_toast: "#f8f8f2"
text_mode_label: "#282a36"
text_code: "#f8f8f2"

# Accents. All three backgrounds here are dark, so all three are light.
accent: "#bd93f9"
accent_on_surface: "#bd93f9"
accent_status_bar: "#bd93f9"
accent_insert: "#50fa7b"
accent_mode_normal: "#bd93f9"
accent_mode_insert: "#50fa7b"

# Status and message state.
status_error: "#ff5555"
status_warning: "#ffb86c"
status_info: "#8be9fd"
status_online: "#50fa7b"
tick_sent: "#f8f8f2"
tick_outbox: "#f8f8f2"
tick_read: "#8be9fd"
tick_failed: "#ff5555"
name_incoming: "#50fa7b"
name_editing: "#f1fa8c"
indicator: "#8be9fd"
unread_separator: "#8be9fd"
waveform_played: "#8be9fd"
reaction_chosen: "#50fa7b"
unread_reaction: "#ff79c6"
unread_mention: "#bd93f9"

# Borders.
border_pane_active: "#50fa7b"
border_bubble_in: "#44475a"
border_bubble_out: "#44475a"
border_overlay: "#44475a"
border_composer_focused: "#50fa7b"
border_composer_flash: "#ff5555"
border_status_sep: "#44475a"

# Message markup.
markup_link: "#8be9fd"
markup_ref: "#ff79c6"
markup_self_mention_fg: "#282a36"

# Highlights. The two base tones are what a highlight fades back to, so each is
# what the thing normally looks like: chat-row text, and the incoming border.
highlight_accent: "#ffb86c"
highlight_error: "#ff5555"
highlight_base_chat: "#f8f8f2"
highlight_base_bubble: "#44475a"
overlay_dim: "#44475a"

# Composer.
composer_counter_dim: "#f8f8f2"
composer_glyph_idle: "#f8f8f2"
composer_glyph_ready: "#bd93f9"

# Per-sender names, walking the scheme's hues so adjacent senders differ in hue
# rather than only in shade.
sender_palette:
  - "#ff5555" # red
  - "#ffb86c" # orange
  - "#f1fa8c" # yellow
  - "#50fa7b" # green
  - "#8be9fd" # cyan
  - "#bd93f9" # purple
  - "#ff79c6" # pink
  - "#d6acff" # bright purple

logo_gradient:
  - {pos: 0.00, color: "#44475a"}
  - {pos: 0.30, color: "#44475a"}
  - {pos: 0.60, color: "#bd93f9"}
  - {pos: 0.85, color: "#ff79c6"}
  - {pos: 1.00, color: "#f8f8f2"}
