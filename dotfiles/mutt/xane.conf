# HTML conversion: y in compose sends without signature, S sends with it
set my_filter_nosig = "~/.mutt/html-alternative.py"
set my_filter_sig = "~/.mutt/html-alternative.py --signature ~/.mutt/xane/xane-signature.html"
set send_multipart_alternative_filter = $my_filter_nosig

# Message-ID domain (otherwise mutt uses this server's internal hostname)
set hostname = "xane.ai"
